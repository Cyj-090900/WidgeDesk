name: Build packages (win-x64)

# Builds both deliverables on GitHub's own Windows runners and publishes them as a Release:
#   * an Inno Setup installer  - this is what the in-app updater consumes
#   * a portable zip           - for people who do not want to install anything
#
# Why build here rather than locally: a Windows 10 install whose ntdll predates the 2023 CET
# kernel fixes (KB5044273 / ntdll 10.0.19041.5007) cannot even run the SDK's CET-marked csc.exe,
# so `dotnet build` fails before compiling anything. GitHub's runners are fully patched. The
# produced binaries are not CET-marked (Directory.Build.props sets CETCompat=false), so the
# packages still run on Windows 10.
#
# The updater (GlassDesk.AppServices.Updates.UpdateClient) is strict, and this workflow has to
# satisfy it exactly:
#   * the release tag must be a plain X.Y.Z version, optionally prefixed with "v";
#   * the asset must be named GlassDesk-<version>-win-x64-Setup.exe;
#   * the release must win the repository's "latest" query (not a draft or prerelease);
#   * the asset must carry a sha256 digest, which GitHub computes automatically on upload.
# A mismatched name or tag makes the app report a malformed update instead of finding one.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read product version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if (-not $version) { throw 'Version not found in Directory.Build.props.' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$version' must be a plain X.Y.Z; the updater rejects anything else." }
          Write-Host "product version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run core tests
        # Pure-logic tests, no desktop access. Informational: a failure stays visible in the log
        # but must not stop the package from being produced.
        continue-on-error: true
        run: dotnet test tests/GlassDesk.Core.Tests/GlassDesk.Core.Tests.csproj -c Release --nologo

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish src/GlassDesk.App/GlassDesk.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishReadyToRun=true `
            -p:InformationalVersion=${{ steps.version.outputs.version }} `
            -p:IncludeSourceRevisionInInformationalVersion=false `
            -o publish
          if (-not (Test-Path publish/GlassDesk.exe)) { throw 'GlassDesk.exe was not produced.' }
          if (-not (Test-Path publish/update-source.json)) { throw 'update-source.json was not published; the updater would fall back to its compiled-in source.' }

      - name: Add licence files
        shell: pwsh
        run: |
          Copy-Item LICENSE publish/LICENSE.txt
          Copy-Item NOTICE publish/NOTICE.txt
          Copy-Item docs/third-party publish/third-party -Recurse

      - name: Verify the executable is not CET-marked
        # A CET-marked image fail-fasts on unpatched Windows 10, which is the whole point of this
        # fork. Fail the build rather than ship a package that cannot start there.
        shell: pwsh
        run: python tools/check-cet.py publish/GlassDesk.exe

      - name: Install Inno Setup
        id: inno
        shell: pwsh
        run: |
          # Inno Setup 7 is required: the .iss uses SetupArchitecture, an IS7-only directive, and
          # IS6 aborts on it with "Unrecognized [Setup] section directive". Chocolatey only
          # carries IS6, so fetch the official IS7 release from the vendor's GitHub.
          #
          # jrsoftware/issrc publishes one release per Inno Setup version, tagged is-<x>_<y>_<z>.
          $version = '7.1.0'
          $tag = 'is-' + ($version -replace '\.', '_')
          $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$version-x64.exe"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$version-x64.exe"
          $target = Join-Path $env:RUNNER_TEMP "innosetup7"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -Wait -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$target"
          )
          $iscc = Join-Path $target 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc after installing Inno Setup 7." }
          Write-Host "ISCC: $iscc"
          if (-not (Test-Path (Join-Path $target 'Languages\ChineseSimplified.isl'))) {
            throw 'ChineseSimplified.isl is missing; the [Languages] section requires it.'
          }
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Compile installer
        shell: pwsh
        run: |
          $env:GLASSDESK_PACKAGE_STAGE = (Resolve-Path publish).Path
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Push-Location packaging
          try {
            & "${{ steps.inno.outputs.iscc }}" `
              /DAppIdValue=GlassDesk.Independent `
              "/DProductVersion=${{ steps.version.outputs.version }}" `
              "/DFileVersion=${{ steps.version.outputs.version }}.0" `
              "/DPackageBaseName=GlassDesk-${{ steps.version.outputs.version }}-win-x64" `
              "/O$(Resolve-Path ..\artifacts)" `
              GlassDesk-Capture.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }
          } finally { Pop-Location }
          Get-ChildItem artifacts | ForEach-Object { Write-Host "  produced: $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }

      - name: Verify installer name matches what the updater expects
        # UpdateClient looks for exactly GlassDesk-<version>-win-x64-Setup.exe. Getting this wrong
        # is the difference between the updater working and silently reporting "no update".
        shell: pwsh
        run: |
          $expected = "GlassDesk-${{ steps.version.outputs.version }}-win-x64-Setup.exe"
          if (-not (Test-Path "artifacts/$expected")) {
            Get-ChildItem artifacts | ForEach-Object { Write-Host "found: $($_.Name)" }
            throw "Expected installer '$expected' was not produced."
          }
          Write-Host "installer OK: $expected"

      - name: Package portable zip
        shell: pwsh
        run: |
          $name = "GlassDesk-${{ steps.version.outputs.version }}-win-x64"
          New-Item -ItemType Directory -Path "stage/$name" -Force | Out-Null
          Copy-Item publish/* "stage/$name" -Recurse -Force
          if (Test-Path "stage/$name/Data") { throw 'The package unexpectedly contains a Data directory.' }
          Compress-Archive -Path "stage/$name" -DestinationPath "artifacts/$name.zip" -Force
          Write-Host "portable zip: $name.zip"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlassDesk-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        # The tag is the plain product version (v-prefixed), because the updater parses
        # tag_name as X.Y.Z and compares it against the running product version.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $version = "${{ steps.version.outputs.version }}"

          # Remove the earlier ad-hoc tag from the first iteration: its name is not a version,
          # so the updater would reject it, and it must not linger as the repository's latest.
          gh release delete win10-build --yes --cleanup-tag 2>$null

          # Drop any earlier build of this same version so this run replaces it cleanly and the
          # release stays eligible as the repository's "latest".
          gh release delete $tag --yes --cleanup-tag 2>$null

          $notes = @"
          自包含构建，无需另装 .NET 运行时。

          - ``GlassDesk-$version-win-x64-Setup.exe`` — 安装版，**设置中心的"检查更新"用它**。
          - ``GlassDesk-$version-win-x64.zip`` — 便携版，解压后双击 GlassDesk.exe 即可运行（不支持自我更新）。

          系统要求：Windows 10 2004（Build 19041）及以上，x64。

          源码提交：${{ github.sha }}
          "@

          gh release create $tag artifacts/* --title "GlassDesk $version (win-x64)" --notes $notes
          Write-Host "released: $tag"
